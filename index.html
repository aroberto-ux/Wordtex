<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banco de problemas</title>

  <link rel="preconnect" href="https://rsms.me" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

  <link rel="stylesheet" href="assets/styles.css" />

  <!-- TikZJax (diagramas) y MathJax (fórmulas) cargan sin bloquear la interfaz.
       Son opcionales: la app funciona aunque no carguen. -->
  <link rel="stylesheet" type="text/css" href="https://tikzjax.com/v1/fonts.css" />
  <script>
    window.TikZJaxNoAutostart = true;
    window.MathJax = {
      tex: { inlineMath: [["\\(", "\\)"], ["$", "$"]], displayMath: [["\\[", "\\]"], ["$$", "$$"]] },
      options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre"] }
    };
  </script>
  <script defer src="https://tikzjax.com/v1/tikzjax.js"
          onerror="window.__tikzFallo=true;console.error('No se pudo cargar tikzjax.js desde tikzjax.com')"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"
          onerror="window.__mathFallo=true;console.error('No se pudo cargar MathJax desde el CDN')"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-top">
      <span class="marca">Banco de problemas</span>
      <div class="header-acciones">
        <span id="estado-nube" class="estado-nube" data-modo="conectando" title="Estado de almacenamiento"></span>
        <button type="button" id="theme-toggle" class="icon-btn" aria-label="Cambiar tema" title="Cambiar tema">
          <svg class="ico-luna" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <svg class="ico-sol" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- Vista: asignaturas -->
    <section id="vista-asignaturas">
      <div class="encabezado">
        <div>
          <h1>Asignaturas</h1>
          <p class="sub">Crea un espacio por asignatura y sube tus problemas con sus respuestas.</p>
        </div>
        <button type="button" id="btn-nueva-asig" class="btn">Nueva asignatura</button>
      </div>
      <div id="grid-asignaturas" class="grid-asignaturas"></div>
    </section>

    <!-- Vista: problemas de una asignatura -->
    <section id="vista-problemas" hidden>
      <button type="button" id="btn-volver" class="link-btn btn-volver">← Asignaturas</button>

      <div class="encabezado">
        <div>
          <h1 id="asig-nombre"></h1>
          <p id="asig-descripcion" class="sub"></p>
        </div>
        <button type="button" id="btn-exportar" class="btn btn-sutil">Exportar JSON</button>
      </div>

      <div class="toolbar" aria-label="Controles">
        <input type="search" id="buscador" placeholder="Buscar…" aria-label="Buscar problemas" />
        <select id="filtro-tema" aria-label="Filtrar por tema"><option value="">Todos los temas</option></select>
        <select id="filtro-dificultad" aria-label="Filtrar por dificultad">
          <option value="">Toda dificultad</option>
          <option value="baja">Baja</option>
          <option value="media">Media</option>
          <option value="alta">Alta</option>
        </select>
      </div>

      <div id="dropzone" class="dropzone" tabindex="0" role="button"
           aria-label="Arrastra archivos JSON aquí o haz clic para seleccionar">
        <span>Arrastra archivos <code>.json</code> aquí o <u>selecciónalos</u> para agregar problemas</span>
        <input type="file" id="file-input" accept="application/json,.json" multiple hidden />
      </div>
      <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

      <p id="contador" class="contador"></p>
      <div id="lista" class="lista" aria-label="Lista de problemas"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      Datos compartidos en Firebase · Diagramas con <a href="https://tikzjax.com/" target="_blank" rel="noopener">TikZJax</a> · Fórmulas con <a href="https://www.mathjax.org/" target="_blank" rel="noopener">MathJax</a>
    </div>
  </footer>

  <!-- Diálogo: crear/editar asignatura -->
  <dialog id="dlg-asig">
    <form method="dialog" class="form-dlg">
      <h2 id="dlg-asig-titulo">Nueva asignatura</h2>
      <label>Nombre
        <input type="text" id="dlg-asig-nombre" maxlength="120" required placeholder="p. ej. Mecánica de Sólidos" />
      </label>
      <label>Descripción <span class="opcional">(opcional)</span>
        <textarea id="dlg-asig-desc" maxlength="400" rows="2" placeholder="Breve descripción"></textarea>
      </label>
      <div class="form-acciones">
        <button type="button" id="dlg-asig-cancelar" class="btn btn-sutil">Cancelar</button>
        <button type="button" id="dlg-asig-guardar" class="btn">Guardar</button>
      </div>
    </form>
  </dialog>

  <template id="tpl-asignatura">
    <article class="card-asig">
      <h3 class="card-asig-nombre"></h3>
      <p class="card-asig-desc"></p>
      <div class="card-asig-pie">
        <span class="card-asig-meta"></span>
        <span class="card-asig-acciones">
          <button type="button" class="link-btn btn-editar">Editar</button>
          <button type="button" class="link-btn btn-borrar">Borrar</button>
        </span>
      </div>
      <button type="button" class="btn-abrir" aria-label="Abrir asignatura"></button>
    </article>
  </template>

  <template id="tpl-problema">
    <article class="problema">
      <div class="problema-cabecera">
        <span class="chip chip-tema"></span>
        <span class="chip chip-dificultad"></span>
        <button type="button" class="btn-eliminar-prob" title="Eliminar problema" aria-label="Eliminar problema">×</button>
      </div>
      <div class="problema-enunciado"></div>
      <div class="problema-diagrama-enunciado"></div>
      <button type="button" class="link-btn btn-revelar">Mostrar respuesta</button>
      <div class="problema-respuesta" hidden>
        <div class="respuesta-texto"></div>
        <div class="problema-diagrama-respuesta"></div>
      </div>
      <div class="problema-fuente"></div>
    </article>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
